worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 128k;
    client_body_timeout 15s;
    send_timeout 60s;

    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_client_certificate /run/tls/client-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            proxy_pass http://agent-gateway:8083;
            proxy_http_version 1.1;
            proxy_set_header Host agent-gateway;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto https;
            # Always overwrite a caller-supplied value with the certificate that
            # Nginx verified during this TLS connection.
            proxy_set_header X-EO-Client-Cert $ssl_client_escaped_cert;
            proxy_request_buffering on;
            proxy_buffering off;
        }
    }
}
