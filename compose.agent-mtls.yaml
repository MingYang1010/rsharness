services:
  agent-gateway:
    environment:
      EO_AGENT_TRUSTED_MTLS_HEADER: "1"

  agent-mtls-ingress:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine3.21@sha256:a6bd0e0995ab4723fb65068665f8016decb67dc6a6a32eddc415c7d1229cada6
    profiles: [agent-mtls]
    read_only: true
    init: true
    volumes:
      - ./config/nginx-agent-mtls.conf:/etc/nginx/nginx.conf:ro
      - agent-mtls-tls:/run/tls:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 128m
    pids_limit: 32
    networks: [agent-front, agent-client]

networks:
  agent-client:
    internal: true

volumes:
  agent-mtls-tls:
    external: true
    name: ${EO_MTLS_TLS_VOLUME:?set EO_MTLS_TLS_VOLUME to a reviewed server-only TLS volume}
